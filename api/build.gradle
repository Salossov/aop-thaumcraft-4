plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
neoForge { version = project.neo_version }
base { archivesName = 'thaumcraft-api' }
def rulesTest = tasks.register('rulesTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'thaumcraft.api.RulesTest'
    workingDir = rootProject.projectDir
}
tasks.named('check') { dependsOn rulesTest }
// RulesTest is a Java main harness; Gradle's framework discovery does not execute it.
tasks.named('test') { enabled = false }

def essentiaRulesTest = tasks.register('essentiaRulesTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'thaumcraft.api.EssentiaRulesTest'
    workingDir = rootProject.projectDir
}
tasks.named('check') { dependsOn essentiaRulesTest }
