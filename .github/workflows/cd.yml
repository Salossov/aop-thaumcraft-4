name: Build and release

on:
  push:
    branches: [main]
    paths: &build_paths
      - 'api/src/**'
      - 'mod/src/**'
      - 'example-addon/src/**'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.ps1'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'tools/**'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
  pull_request:
    paths: *build_paths
  workflow_dispatch:
    inputs:
      release:
        description: Publish an ordinary release (unchecked updates nightly)
        type: boolean
        required: false
        default: false
      version:
        description: 'Optional version, e.g. 1.0.0; blank uses mod_version from gradle.properties'
        type: string
        required: false
        default: ''

      force_rebuild:
        description: Rebuild JARs instead of reusing verified artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: thaumcraft-cd
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SUITE_TARGET: core
      RELEASE_REQUESTED: ${{ inputs.release || false }}
      SUITE_FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      SUITE_CORE_VERSION: ${{ inputs.version || '' }}
      SUITE_UI_REPOSITORY: ${{ vars.AOPUI_REPOSITORY || 'Salossov/aop-ui' }}
      SUITE_CORE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out AOP UI
        if: ${{ !env.ACT }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.AOPUI_REPOSITORY || 'Salossov/aop-ui' }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          ref: ${{ vars.AOPUI_REF || 'main' }}
          path: .dependencies/aopui
          fetch-depth: 0
          persist-credentials: false
      - name: Check build and publication rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle dependency and task cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-disabled: ${{ env.ACT == 'true' }}
      - name: Lock source revisions and toolchain
        id: lock
        run: python3 .github/scripts/suite.py prepare

      - name: Plan UI artifact identity
        id: plan_ui
        run: python3 .github/scripts/suite.py plan ui
      - name: Restore verified release UI
        id: cache_ui_release
        if: ${{ !env.ACT && !inputs.force_rebuild }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/mod-suite/ui/release
          key: ${{ steps.plan_ui.outputs.release-key }}
      - name: Restore verified nightly UI
        id: cache_ui_nightly
        if: ${{ !env.ACT && !inputs.force_rebuild && !inputs.release && steps.cache_ui_release.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/mod-suite/ui/nightly
          key: ${{ steps.plan_ui.outputs.nightly-key }}
      - name: Find matching published UI
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
        run: python3 .github/scripts/suite.py fetch ui
      - name: '1 - Build or reuse UI'
        id: build_ui
        env:
          SUITE_RELEASE_CACHE_HIT: ${{ steps.cache_ui_release.outputs.cache-hit }}
          SUITE_NIGHTLY_CACHE_HIT: ${{ steps.cache_ui_nightly.outputs.cache-hit }}
        run: python3 .github/scripts/suite.py build ui
      - name: Save verified UI
        if: ${{ !env.ACT && steps.build_ui.outputs.store == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.build_ui.outputs.path }}
          key: ${{ steps.build_ui.outputs.key }}

      - name: Plan TC4 artifact identity
        id: plan_core
        run: python3 .github/scripts/suite.py plan core
      - name: Restore verified release TC4
        id: cache_core_release
        if: ${{ !env.ACT && !inputs.force_rebuild }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/mod-suite/core/release
          key: ${{ steps.plan_core.outputs.release-key }}
      - name: Restore verified nightly TC4
        id: cache_core_nightly
        if: ${{ !env.ACT && !inputs.force_rebuild && !inputs.release && steps.cache_core_release.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/mod-suite/core/nightly
          key: ${{ steps.plan_core.outputs.nightly-key }}
      - name: Find matching published TC4
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
        run: python3 .github/scripts/suite.py fetch core
      - name: '2 - Build or reuse TC4 and API'
        id: build_core
        env:
          SUITE_RELEASE_CACHE_HIT: ${{ steps.cache_core_release.outputs.cache-hit }}
          SUITE_NIGHTLY_CACHE_HIT: ${{ steps.cache_core_nightly.outputs.cache-hit }}
        run: python3 .github/scripts/suite.py build core
      - name: Save verified TC4
        if: ${{ !env.ACT && steps.build_core.outputs.store == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.build_core.outputs.path }}
          key: ${{ steps.build_core.outputs.key }}

      - name: Collect component artifacts and provenance
        run: python3 .github/scripts/suite.py collect core
      - name: Save component artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: aop-core-${{ steps.build_core.outputs.version }}
          path: dist/suite/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify publication plan locally
        if: ${{ env.ACT && github.event_name != 'pull_request' }}
        run: python3 .github/scripts/suite.py publish core --dry-run
      - name: Publish component to GitHub Releases
        if: ${{ !env.ACT && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/suite.py publish core
