name: Build and release

on:
  push:
    branches: [main]
    paths: &build_paths
      - 'api/src/**'
      - 'mod/src/**'
      - 'example-addon/src/**'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.ps1'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'tools/**'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
  pull_request:
    paths: *build_paths
  workflow_dispatch:
    inputs:
      release:
        description: Publish an ordinary release (not a prerelease or nightly)
        type: boolean
        required: false
        default: false
      version:
        description: 'Optional version, e.g. 1.0.0; blank uses mod_version from gradle.properties'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: thaumcraft-cd
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && 'release' || github.event_name == 'push' && 'nightly' || 'build' }}
      RELEASE_VERSION: ${{ inputs.version || '' }}
      RELEASE_NAME: 'AOP: Thaumcraft 4'
      RELEASE_REQUIREMENTS: 'AOP: UI 0.7.x and Curios are required. TerraBlender is optional. Install the gameplay JAR; API and sources are for development.'
      RELEASE_ARTIFACTS: |
        mod/build/libs/thaumcraft-*.jar
        api/build/libs/thaumcraft-api-*.jar
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out AOP UI
        if: ${{ !env.ACT }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.AOPUI_REPOSITORY || 'Salossov/aop-ui' }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          ref: ${{ vars.AOPUI_REF || 'main' }}
          path: .dependencies/aopui
          persist-credentials: false
      - name: Check release rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select build version
        id: version
        run: python3 .github/scripts/release.py prepare
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-disabled: ${{ env.ACT == 'true' }}

      - name: Build AOP UI
        working-directory: .dependencies/aopui
        run: sh ./gradlew --no-daemon --console=plain assemble
      - name: Select AOP UI artifact
        run: |
          ui=$(find .dependencies/aopui/build/libs -maxdepth 1 -name 'aopui-*.jar' ! -name '*-sources.jar')
          test -n "$ui" && test "$(printf '%s\n' "$ui" | wc -l)" -eq 1
          echo "AOP_UI_JAR=$PWD/$ui" >> "$GITHUB_ENV"
      - name: Build and check
        run: sh ./gradlew --no-daemon --console=plain --no-problems-report "-Pmod_version=$BUILD_VERSION" clean build :mod:compileProductionVerificationJava "-PaopUiJar=$AOP_UI_JAR"

      - name: Collect release files
        run: python3 .github/scripts/release.py collect
      - name: Verify publication plan locally
        if: ${{ env.ACT && env.RELEASE_MODE != 'build' }}
        run: python3 .github/scripts/release.py publish --dry-run
      - name: Save build artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: thaumcraft-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        if: ${{ env.RELEASE_MODE != 'build' && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py publish
