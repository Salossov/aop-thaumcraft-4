plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    group = rootProject.mod_group
    version = rootProject.mod_version
    repositories { mavenCentral() }
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}

tasks.named('build') { dependsOn ':api:build', ':mod:build', ':example-addon:build' }

// SDK is a development distribution; API classes remain bundled only in the core runtime JAR.
tasks.register('addonSdk', Zip) {
    dependsOn ':api:jar', ':api:sourcesJar', ':example-addon:jar', ':mod:jar'
    archiveBaseName = 'thaumcraft-addon-sdk'
    archiveVersion = project.mod_version
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(project(':api').tasks.named('jar')) { into 'lib' }
    from(project(':api').tasks.named('sourcesJar')) { into 'lib' }
    from('docs/addons') { exclude 'example-*.gradle'; into 'docs' }
    from('example-addon/src') { into 'example-addon/src' }
    from('docs/addons/example-build.gradle') { into 'example-addon'; rename { 'build.gradle' } }
    from('docs/addons/example-settings.gradle') { into 'example-addon'; rename { 'settings.gradle' } }
    from('gradlew.ps1') { into 'example-addon' }
    from('gradle/wrapper') { into 'example-addon/gradle/wrapper' }
    from('NOTICE.md') { into 'docs' }
}
